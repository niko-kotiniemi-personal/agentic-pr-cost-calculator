name: Bug report
description: Something the calculator does differently from its documentation
labels: [bug]
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: This repository is public, and an issue cannot be made private later.
      options:
        - label: This issue holds no transcript, session identifier, token, private name or usage figure from private work.
          required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Name the feature page or requirement in docs/ that says what should happen, if you can.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
  - type: textarea
    id: versions
    attributes:
      label: Versions
      value: |
        - Calculator version or commit:
        - Python version:
        - Claude Code version:
        - git version:
