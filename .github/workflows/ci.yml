name: CI

on:
  pull_request:
    # GitHub's default three, and `edited`, which a change of the pull request's
    # base branch is, so that the tests compare with the new base. `edited` also
    # runs them again when the title or the description changes, a cost that
    # T70 accepts.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# No `paths:` filters: a required check that never runs never reports, and the
# pull request then waits forever.

defaults:
  run:
    # GitHub's default is `bash -e` without pipefail, which lets `check | head`
    # pass while the check failed.
    shell: bash

# Declared rather than inherited, so what these jobs can do is readable here.
# Nothing in this workflow writes, comments or reads a secret.
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the tool supports, and the newest release. The
        # oldest rises only when it nears its end of life, or when a security fix
        # needs a newer one (DR-134).
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The whole history, so that the tests can compare the decision
          # records with the commit named below.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
        env:
          # What the default branch held before this change: the pull request's
          # base commit, or the commit that a push to the default branch replaced.
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: scripts/verify-openspec.sh

  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/sync-superpowers.sh --check

  # The one check a ruleset needs to require: it passes only when every job
  # above passed.
  ci:
    if: always()
    needs: [python, openspec, vendor]
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          [ "$(echo "$results" | jq -r 'map(select(. != "success")) | length')" -eq 0 ]
