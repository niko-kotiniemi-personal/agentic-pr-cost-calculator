name: CI

on:
  pull_request:
  push:
    branches: [main]

# No `paths:` filters: a required check that never runs never reports, and the
# pull request then waits forever.

defaults:
  run:
    # GitHub's default is `bash -e` without pipefail, which lets `check | head`
    # pass while the check failed.
    shell: bash

# Declared rather than inherited, so what these jobs can do is readable here.
# Nothing in this workflow writes, comments or reads a secret.
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: scripts/verify-openspec.sh

  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/sync-superpowers.sh --check

  # The one check a ruleset needs to require: it passes only when every job
  # above passed.
  ci:
    if: always()
    needs: [python, openspec, vendor]
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          [ "$(echo "$results" | jq -r 'map(select(. != "success")) | length')" -eq 0 ]
